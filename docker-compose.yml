services:
  ollama:
    image: ollama/ollama:latest
    container_name: tunisian-ollama
    ports:
      - "11435:11434"            # host 11435 -> container 11434 (avoids clash with your local Ollama)
    volumes:
      - ollama_data:/root/.ollama  # keeps downloaded models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia     # give the container your GPU
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.7-pg17   # official image: PostgreSQL 17 + pgvector 0.8.7
    container_name: tunisian-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"                        # host port 5433 avoids a clash with any local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data    # data survives container restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro   # our schema, run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: tunisian-api
    ports:
      - "8000:8000"
    env_file:
      - .env                     # secrets injected at runtime, not baked in the image
    environment:
      # Overrides .env: inside Compose, other services are reached by SERVICE NAME.
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_data:
  pgdata: