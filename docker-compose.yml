services:
  ollama:
    image: ollama/ollama:latest
    container_name: tunisian-ollama
    ports:
      - "11435:11434"            # host 11435 -> container 11434 (avoids clash with your local Ollama)
    volumes:
      - ollama_data:/root/.ollama  # keeps downloaded models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia     # give the container your GPU
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: .
    container_name: tunisian-api
    ports:
      - "8000:8000"
    env_file:
      - .env                     # secrets injected at runtime, not baked in the image
    environment:
      # Overrides .env: inside Compose, Ollama is reached by SERVICE NAME.
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_data: